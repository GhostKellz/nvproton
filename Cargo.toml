[package]
name = "nvproton"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "NVIDIA-optimized Proton integration layer for Linux gaming (Reflex, VRR, shader pre-warm)"
authors = ["Christopher Kelley <ckelley@ghostkellz.sh>"]
license = "MIT"
repository = "https://github.com/ghostkellz/nvproton"
readme = "README.md"
keywords = ["nvidia", "proton", "gaming", "vulkan", "reflex"]
categories = ["games", "command-line-utilities"]

[features]
default = []
# Per-profile microphone noise suppression via ghostwave-core (PipeWire virtual source).
noise-suppression = ["dep:ghostwave-core"]
# Game capture / encode / stream via ghoststream (NVENC). Pulls in ffmpeg/pipewire/onnx.
streaming = ["dep:ghoststream", "dep:tokio"]
# Everything.
full = ["noise-suppression", "streaming"]

[dependencies]
anyhow = "1"
ash = "0.38"
clap = { version = "4", features = ["derive"] }
dirs = "6"
env_logger = "0.11"
glob = "0.3"
hex = "0.4"
libloading = "0.9"
log = "0.4"
once_cell = "1"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "1"
walkdir = "2"

# Optional integrations (off by default to keep the base launcher lean).
# NB: keep ghostwave-core's default `cpal` feature — device_detection.rs uses cpal unconditionally.
ghostwave-core = { git = "https://github.com/ghostkellz/ghostwave", tag = "v0.3.1", features = ["pipewire-backend"], optional = true }
ghoststream = { git = "https://github.com/ghostkellz/ghoststream", branch = "main", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
tempfile = "3.24.0"
